---
- name: Swap Management
  hosts: all
  become: yes
  vars:
    swap_file_path: /swapfile
    swap_file_size_mb: 2048
  tasks:
    - name: Check if swap file already exists
      stat:
        path: "{{ swap_file_path }}"
      register: swap_file_check
    - name: Create swap file
      command: dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_file_size_mb }}
      when: not swap_file_check.stat.exists
    - name: Set swap file permissions
      file:
        path: "{{ swap_file_path }}"
        mode: '0600'
        owner: root
        group: root
    - name: Format swap file
      command: mkswap {{ swap_file_path }}
      when: not swap_file_check.stat.exists
    - name: Enable swap file
      command: swapon {{ swap_file_path }}
      when: not swap_file_check.stat.exists
    - name: Persist swap in /etc/fstab
      lineinfile:
        path: /etc/fstab
        line: '{{ swap_file_path }} none swap sw 0 0'
        state: present
    - name: Set swappiness
      sysctl:
        name: vm.swappiness
        value: '10'
        state: present
        reload: yes
    - name: Display swap status
      command: swapon --show
      register: swap_status
      changed_when: false
    - name: Show swap info
      debug:
        var: swap_status.stdout_lines
