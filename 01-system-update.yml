---
- name: System Update
  hosts: all
  become: yes
  tasks:
    - name: Update all packages (RHEL/CentOS)
      yum:
        name: '*'
        state: latest
      when: ansible_os_family == 'RedHat'
    - name: Update all packages (Debian/Ubuntu)
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_os_family == 'Debian'
    - name: Clean up old packages (RHEL/CentOS)
      command: yum autoremove -y
      when: ansible_os_family == 'RedHat'
    - name: Clean up old packages (Debian/Ubuntu)
      apt:
        autoremove: yes
        purge: yes
      when: ansible_os_family == 'Debian'
